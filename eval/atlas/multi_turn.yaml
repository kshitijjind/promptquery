        WHERE jl.is_posted AND a.account_type='EXPENSE' AND jl.posting_date >= '2026-01-01' AND jl.posting_date < '2027-01-01'
    - question: And revenue for the same period?
      gold_sql: |
        SELECT ROUND(SUM(jl.functional_credit_amount-jl.functional_debit_amount),2) FROM fin_journal_lines jl JOIN fin_accounts a ON a.id=jl.account_id
        WHERE jl.is_posted AND a.account_type='REVENUE' AND jl.posting_date >= '2026-01-01' AND jl.posting_date < '2027-01-01'
