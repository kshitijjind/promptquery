# Single-turn evaluation set for the Atlas reporting bot.
# Gold SQL is hand-written against the rpt views and verified by eval/atlas_eval.py --check-gold.
# Evaluation date is fixed: TODAY = 2026-09-27 (ATLAS_TODAY).
# Scoring = execution match: every gold column must be present in the prediction with the same
# values (extra predicted columns allowed); row order checked only when `ordered: true`.

# ---------------------------------------------------------------- sales (volume tenant)
- id: s01
  tenant: volume
  category: sales
  question: What were our total sales in 2024?
  gold_sql: |
    SELECT ROUND(SUM(total_amount),2) FROM sales_orders
    WHERE status NOT IN ('DRAFT','CANCELLED','CREDIT_BLOCKED') AND order_date >= '2024-01-01' AND order_date < '2025-01-01'
- id: s02
  tenant: volume
  category: sales
  question: How many sales orders did we get in March 2025?
  gold_sql: |
    SELECT COUNT(*) FROM sales_orders
    WHERE status NOT IN ('DRAFT','CANCELLED','CREDIT_BLOCKED') AND order_date >= '2025-03-01' AND order_date < '2025-04-01'
- id: s03
  tenant: volume
  category: sales
  question: Give me the 10 biggest customers by sales value in 2025
  ordered: true
  gold_sql: |
    SELECT c.name, ROUND(SUM(so.total_amount),2) s FROM sales_orders so JOIN sales_customers c ON c.id=so.customer_id
    WHERE so.status NOT IN ('DRAFT','CANCELLED','CREDIT_BLOCKED') AND so.order_date >= '2025-01-01' AND so.order_date < '2026-01-01'
    GROUP BY c.id, c.name ORDER BY s DESC LIMIT 10
- id: s04
  tenant: volume
  category: sales
  question: Show sales by quarter for 2025
  ordered: true
  gold_sql: |
    SELECT date_trunc('quarter', order_date)::date q, ROUND(SUM(total_amount),2) FROM sales_orders
    WHERE status NOT IN ('DRAFT','CANCELLED','CREDIT_BLOCKED') AND order_date >= '2025-01-01' AND order_date < '2026-01-01'
    GROUP BY 1 ORDER BY 1
- id: s05
  tenant: volume
  category: sales
  question: Which month of 2024 had the highest sales?
  gold_sql: |
    SELECT date_trunc('month', order_date)::date m, ROUND(SUM(total_amount),2) s FROM sales_orders
    WHERE status NOT IN ('DRAFT','CANCELLED','CREDIT_BLOCKED') AND order_date >= '2024-01-01' AND order_date < '2025-01-01'
    GROUP BY 1 ORDER BY s DESC LIMIT 1
- id: s06
  tenant: volume
  category: sales
  question: What is the average order value in 2025?
  gold_sql: |
    SELECT ROUND(AVG(total_amount),2) FROM sales_orders
    WHERE status NOT IN ('DRAFT','CANCELLED','CREDIT_BLOCKED') AND order_date >= '2025-01-01' AND order_date < '2026-01-01'
- id: s07
  tenant: volume
  category: sales
  question: Which 3 customers bought the least in 2024?
  ordered: true
  gold_sql: |
    SELECT c.name, ROUND(SUM(so.total_amount),2) s FROM sales_orders so JOIN sales_customers c ON c.id=so.customer_id
    WHERE so.status NOT IN ('DRAFT','CANCELLED','CREDIT_BLOCKED') AND so.order_date >= '2024-01-01' AND so.order_date < '2025-01-01'
    GROUP BY c.id, c.name ORDER BY s ASC LIMIT 3
- id: s08
  tenant: volume
  category: sales
  question: Total sales for Volume Customer 7 in 2025
  gold_sql: |
    SELECT ROUND(SUM(so.total_amount),2) FROM sales_orders so JOIN sales_customers c ON c.id=so.customer_id
    WHERE c.name='Volume Customer 7' AND so.status NOT IN ('DRAFT','CANCELLED','CREDIT_BLOCKED')
      AND so.order_date >= '2025-01-01' AND so.order_date < '2026-01-01'
- id: s09
  tenant: volume
  category: sales
  question: Sales year to date compared with the same period last year
  gold_sql: |
    SELECT ROUND(SUM(total_amount) FILTER (WHERE order_date >= '2026-01-01' AND order_date <= '2026-09-27'),2) ytd,
           ROUND(SUM(total_amount) FILTER (WHERE order_date >= '2025-01-01' AND order_date <= '2025-09-27'),2) prior_ytd
    FROM sales_orders WHERE status NOT IN ('DRAFT','CANCELLED','CREDIT_BLOCKED')
- id: s10
  tenant: volume
  category: sales
  question: How many distinct customers ordered in each year?
  ordered: true
  gold_sql: |
    SELECT EXTRACT(YEAR FROM order_date)::int y, COUNT(DISTINCT customer_id) FROM sales_orders
    WHERE status NOT IN ('DRAFT','CANCELLED','CREDIT_BLOCKED') GROUP BY 1 ORDER BY 1
- id: s11
  tenant: volume
  category: sales
  question: Top 5 items by sales revenue in 2025
  ordered: true
  gold_sql: |
    SELECT i.name, ROUND(SUM(sol.line_amount),2) v FROM sales_order_lines sol JOIN sales_orders so ON so.id=sol.order_id JOIN inv_items i ON i.id=sol.item_id
    WHERE so.status NOT IN ('DRAFT','CANCELLED','CREDIT_BLOCKED') AND so.order_date >= '2025-01-01' AND so.order_date < '2026-01-01'
    GROUP BY i.id, i.name ORDER BY v DESC, i.name LIMIT 5
- id: s12
  tenant: volume
  category: sales
  question: How many units were sold in total in 2024?
  gold_sql: |
    SELECT SUM(sol.ordered_quantity) FROM sales_order_lines sol JOIN sales_orders so ON so.id=sol.order_id
    WHERE so.status NOT IN ('DRAFT','CANCELLED','CREDIT_BLOCKED') AND so.order_date >= '2024-01-01' AND so.order_date < '2025-01-01'

